name: Something's wrong
description: It did something it shouldn't, or didn't do something it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A security problem? Please don't file it here; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: The smallest way to see it
      description: A few lines we can run. The smaller, the sooner we can fix it.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: 'The output of `npm ls @bydawn/dryrun`'
    validations:
      required: true
